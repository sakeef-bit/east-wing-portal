<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerIQ | Forensic Financial Automation</title>
    <!-- Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --hca-sage: #C5D1B8; 
            --hca-dark: #2C3E50; 
            --hca-bg: #F8F9FA; 
            --hca-border: #E2E8F0;
        }
        body { background: var(--hca-bg); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--hca-dark); padding-bottom: 70px; }
        .rounded-xl { border-radius: 16px !important; }
        
        .navbar { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border-bottom: 2px solid var(--hca-sage); padding: 0.8rem 2rem; }
        .brand-logo { font-weight: 800; letter-spacing: -0.5px; }
        .brand-badge { background: var(--hca-sage); color: var(--hca-dark); font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; margin-left: 8px; letter-spacing: 0.5px; }

        .hero-section { background: var(--hca-dark); color: white; padding: 60px 20px 70px; text-align: center; border-radius: 0 0 32px 35px; margin-bottom: 40px; }
        
        .card-custom { background: white; border: 1px solid var(--hca-border); border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.03); height: 100%; display: flex; flex-direction: column; transition: all 0.25s ease-in-out; }
        .card-custom:hover { transform: translateY(-6px); box-shadow: 0 16px 32px rgba(44,62,80,0.1); border-color: var(--hca-sage); }
        .card-img-container { height: 170px; overflow: hidden; position: relative; }
        .card-img-top { height: 100%; width: 100%; object-fit: cover; filter: brightness(0.95); transition: transform 0.3s ease; }
        
        .btn-hca { background: var(--hca-sage); color: var(--hca-dark); border: none; font-weight: 600; padding: 12px 20px; border-radius: 12px; }
        .btn-dark-hca { background: var(--hca-dark); color: white; border-radius: 12px; padding: 12px 20px; font-weight: 600; }
        
        .status-pill { background: white; padding: 6px 16px; border-radius: 30px; border: 1px solid var(--hca-border); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #CBD5E1; }
        .dot-green { background: #22C55E; box-shadow: 0 0 8px #22C55E; }
        
        .view-pane { display: none; }
        #st { background: white; border-radius: 16px; padding: 20px 30px; position: fixed; bottom: 30px; right: 30px; box-shadow: 0 12px 32px rgba(0,0,0,0.12); display: none; z-index: 2000; border: 1px solid var(--hca-sage); }

        /* VENDOR HOVER POPOVER CARD STYLES */
        .vendor-cell { position: relative; }
        .vendor-hover {
            cursor: pointer;
            font-weight: 700;
            color: var(--hca-dark);
            text-decoration: underline dotted var(--hca-sage);
        }
        .vendor-card-popup {
            display: none;
            position: absolute;
            bottom: 125%;
            left: 0;
            width: 290px;
            background: white;
            border: 1px solid var(--hca-sage);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.15);
            z-index: 1000;
            font-size: 0.82rem;
            color: var(--hca-dark);
        }
        .vendor-cell:hover .vendor-card-popup { display: block; }
        .vendor-badge { font-size: 0.65rem; font-weight: bold; background: var(--hca-dark); color: white; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; display: inline-block; }
    </style>
</head>
<body>

<nav class="navbar d-flex justify-content-between align-items-center">
    <div class="fw-bold fs-4 brand-logo">Ledger<span class="fw-light text-muted">IQ</span> <span class="brand-badge">PRO</span></div>
    <div class="d-flex align-items-center gap-4">
        <div class="small fw-bold d-flex gap-3 status-pill">
            <div class="d-flex align-items-center"><span class="status-dot" id="dot-ledger"></span> Supabase</div>
            <div class="d-flex align-items-center"><span class="status-dot" id="dot-gemini"></span> AI</div>
        </div>
        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 fw-semibold" onclick="location.reload()">Home</button>
    </div>
</nav>

<div id="view-launchpad">
    <header class="hero-section">
        <h1 class="display-5 fw-bold mb-2">Financial Automation Portal</h1>
        <p class="lead opacity-75 mb-0 fs-6">Professional Forensic Ledger Processing & Vendor Intelligence</p>
    </header>
    <div class="container">
        <div id="keyGate" class="row justify-content-center">
            <div class="col-md-5"><div class="card card-custom p-4 text-center">
                <h5 class="mb-3 fw-bold">System Authorization</h5>
                <input type="password" id="master_gk" class="form-control mb-3 text-center rounded-pill" placeholder="Enter Gemini API Key">
                <button class="btn btn-dark-hca w-100 rounded-pill" onclick="lockKey()">Authenticate Workspace</button>
            </div></div>
        </div>
        <div id="mainPortal" style="display:none">
            <div class="card p-4 rounded-xl border-0 shadow-sm mb-4">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <select id="masterClient" class="form-select rounded-pill shadow-none" onchange="pingStatus()"><option value="">-- Select Client Account --</option></select>
                    </div>
                    <div class="col-md-4 text-end pt-0"><button class="btn btn-dark-hca rounded-pill" onclick="showPane('config')">Client Settings</button></div>
                </div>
            </div>
            <div class="row g-4" id="actionGrid" style="opacity:0.3; pointer-events:none;">
                <div class="col-md-4"><div class="card card-custom"><div class="card-body p-4 text-center"><button class="btn btn-hca w-100" onclick="triggerFile('PDF')">Process Bank Statement</button></div></div></div>
                <div class="col-md-4"><div class="card card-custom"><div class="card-body p-4 text-center"><button class="btn btn-hca w-100" onclick="triggerFile('CC')">Process Credit Card PDF</button></div></div></div>
                <div class="col-md-4"><div class="card card-custom"><div class="card-body p-4 text-center"><button class="btn btn-hca w-100" onclick="loadDash()">Open Review Dashboard</button></div></div></div>
            </div>
            <input type="file" id="f_pdf" style="display:none" onchange="handleFile(this, 'PDF')">
            <input type="file" id="f_cc" style="display:none" onchange="handleFile(this, 'CC')">
        </div>
    </div>
</div>

<div id="view-dash" class="view-pane container-fluid px-5 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 id="activeTitle" class="fw-bold mb-0">Dashboard</h2>
        <button class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-semibold" onclick="showPane('launchpad')">Exit Dashboard</button>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm">
        <table class="table table-hover table-sm align-middle">
            <thead class="table-light">
                <tr>
                    <th>Src</th>
                    <th>Date</th>
                    <th>Vendor (Hover for Details)</th>
                    <th>Statement Line Item</th>
                    <th>Amount</th>
                    <th>Expense Account</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tb-staging"></tbody>
        </table>
    </div>
</div>

<div id="st"><strong>Processing Request...</strong></div>

<script>
    const SUPABASE_URL = "https://oxhwhxnoysowuokdhmtr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94aHdoeG5veXNvd3Vva2RobXRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NDU1MTEsImV4cCI6MjEwMzIyMTUxMX0.hQm9RsFit-TVz1pH0Y1Q3VITdbfwLUKA42uq2frZkyc";
    
    let db = null;
    let currentClient = "";
    let localData = [];

    function lockKey() { 
        const keyVal = document.getElementById('master_gk').value;
        if(!keyVal) return alert("Please enter a Gemini API Key");
        localStorage.setItem('hca_gk', keyVal); 
        location.reload(); 
    }

    window.onload = async () => {
        try {
            if (window.supabase) {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch(e) { console.error("Supabase Initialization Error:", e); }

        if(localStorage.getItem('hca_gk')) {
            document.getElementById('keyGate').style.display = 'none'; 
            document.getElementById('mainPortal').style.display = 'block';
            document.getElementById('dot-gemini').classList.add('dot-green');
            await getClientList();
        }
    };

    async function getClientList() {
        if (!db) return;
        const { data } = await db.from('client_metadata').select('client_name');
        const sel = document.getElementById('masterClient');
        sel.innerHTML = '<option value="">-- Select Client Account --</option>';
        if (data && data.length > 0) {
            data.forEach(v => sel.innerHTML += `<option value="${v.client_name}">${v.client_name}</option>`);
        }
    }

    async function pingStatus() {
        currentClient = document.getElementById('masterClient').value;
        if(!currentClient) return;
        document.getElementById('actionGrid').style.opacity = "1";
        document.getElementById('actionGrid').style.pointerEvents = "auto";
        document.getElementById('dot-ledger').className = 'status-dot dot-green';
    }

    function triggerFile(t) { document.getElementById(t === 'PDF' ? 'f_pdf' : 'f_cc').click(); }

    // STRICT VENDOR FILTERING PROMPT
    async function handleFile(input, type) { 
        currentClient = document.getElementById('masterClient').value; 
        if(!currentClient) return alert("Select client account first");

        document.getElementById('st').style.display = 'block'; 
        const reader = new FileReader(); 
        reader.onload = async (e) => { 
            try {
                const pdfData = e.target.result.split(',')[1];
                const apiKey = localStorage.getItem('hca_gk');

                const behavior = type === "CC" ? "Spend is negative, Payments positive." : "Debits are negative, Credits positive.";
                const prompt = `ACT AS: Senior Bookkeeper & Forensic Auditor. Extract all statement transactions.

STRICT VENDOR EXTRACTION RULES:
1. 'vendor': Extract ONLY true commercial merchants or business vendors (e.g., 'Adobe', 'Uber', 'Amazon Web Services', 'Shell', 'Delta Air Lines', 'Marriott', 'The Capital Grille', 'Office Depot').
2. SET 'vendor' TO AN EMPTY STRING ("") if the item is a payroll transaction ('Payroll Direct Deposit'), rent payment ('Monthly Apartment Rent'), transfer/payment ('Auto-Pay Received'), utility bill ('Electric & Gas Utility'), supermarket/freelance payment, or cashback reward.
3. 'desc': Store the exact raw statement line text.

Return ONLY JSON Object: {"transactions":[{"date":"YYYY-MM-DD", "desc":"raw statement line", "vendor":"Clean Merchant Name OR empty string", "amount":0.00}]}`;

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "contents": [{ "parts": [{ "text": prompt }, { "inline_data": { "mime_type": "application/pdf", "data": pdfData }}] }],
                        "generationConfig": { "response_mime_type": "application/json" }
                    })
                });

                const jsonRes = await res.json();
                const rawText = jsonRes.candidates[0].content.parts[0].text;
                const extracted = JSON.parse(rawText.replace(/```json|```/g, '').trim());

                const rows = extracted.transactions.map(t => ({
                    client_name: currentClient,
                    source: type === 'PDF' ? 'BANK' : 'CREDIT CARD',
                    txn_date: t.date,
                    vendor: t.vendor || "", // Strictly empty for non-merchants
                    description: t.desc || "Statement Line",
                    amount: t.amount,
                    status: "PENDING",
                    fingerprint: btoa(t.date + t.desc + t.amount)
                }));

                await db.from('review_staging').insert(rows);
                await loadDash();
            } catch(err) {
                alert("Gemini Processing Error: " + err.message);
                document.getElementById('st').style.display = 'none';
            }
        }; 
        reader.readAsDataURL(input.files[0]); 
    }

    async function loadDash() { 
        currentClient = document.getElementById('masterClient').value; 
        if(!currentClient) return alert("Select client account first"); 

        document.getElementById('st').style.display = 'block'; 
        const { data: staging } = await db.from('review_staging').select('*').eq('client_name', currentClient);

        localData = (staging || []).map(s => ({ 
            row: s.id, 
            src: s.source, 
            date: s.txn_date, 
            vendor: s.vendor || "", 
            desc: s.description || "", 
            amt: String(s.amount), 
            stat: s.status || "PENDING"
        }));

        renderDashboard(); 
    }

    function renderDashboard() {
        document.getElementById('st').style.display = 'none'; 
        showPane('dash'); 
        document.getElementById('activeTitle').innerText = currentClient;
        
        const sBody = document.getElementById('tb-staging'); sBody.innerHTML = "";
        localData.forEach(i => {
            const popupId = `vpop_${i.row}`;
            
            // Only render interactive hover popover if Vendor is present
            const vendorHtml = (i.vendor && i.vendor.trim() !== "") ? `
                <span class="vendor-hover" onmouseenter="fetchVendorIntelligence('${i.vendor.replace(/'/g, "\\'")}', '${popupId}')">
                    ${i.vendor}
                </span>
                <div class="vendor-card-popup" id="${popupId}">Fetching merchant insights...</div>` 
                : `<span class="text-muted small">N/A</span>`;

            sBody.innerHTML += `
                <tr>
                    <td>${i.src}</td>
                    <td>${i.date}</td>
                    <td class="vendor-cell">${vendorHtml}</td>
                    <td><small class="text-muted">${i.desc}</small></td>
                    <td class="fw-bold">$${i.amt}</td>
                    <td><input class="form-control form-control-sm" value="Uncategorized"></td>
                    <td><span class="badge bg-secondary">${i.stat}</span></td>
                </tr>`;
        });
    }

    // AI MERCHANT INTELLIGENCE & CACHING ENGINE
    async function fetchVendorIntelligence(vendorName, targetElementId) {
        if (!vendorName || !db) return;
        const popupEl = document.getElementById(targetElementId);
        if (!popupEl) return;

        // 1. Check Supabase Cache First
        const { data: cached } = await db.from('vendor_knowledge').select('*').eq('vendor_name', vendorName).maybeSingle();
        if (cached && cached.description) {
            const linkHtml = cached.website ? `<br><a href="${cached.website}" target="_blank" class="small text-primary">${cached.website}</a>` : '';
            popupEl.innerHTML = `<span class="vendor-badge">VERIFIED MERCHANT</span><br><strong>${vendorName}</strong><br><span class="text-muted">${cached.description}</span>${linkHtml}`;
            return;
        }

        // 2. Query Gemini for Live Merchant Details & Website
        popupEl.innerHTML = `<em>Querying merchant intelligence...</em>`;
        const apiKey = localStorage.getItem('hca_gk');
        
        try {
            const prompt = `ACT AS: Corporate Intelligence Agent. Provide details for the vendor/company "${vendorName}".
Return ONLY JSON:
{
  "description": "1-2 sentence business overview of what they sell or provide.",
  "website": "Official domain URL (e.g. https://www.adobe.com)"
}`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    "contents": [{ "parts": [{ "text": prompt }] }],
                    "generationConfig": { "response_mime_type": "application/json" }
                })
            });

            const jsonRes = await res.json();
            const rawText = jsonRes.candidates[0].content.parts[0].text;
            const info = JSON.parse(rawText.replace(/```json|```/g, '').trim());

            const linkHtml = info.website ? `<br><a href="${info.website}" target="_blank" class="small text-primary">${info.website}</a>` : '';
            popupEl.innerHTML = `<span class="vendor-badge">AI MERCHANT SUMMARY</span><br><strong>${vendorName}</strong><br><span>${info.description}</span>${linkHtml}`;

            // Cache in Supabase vendor_knowledge table
            await db.from('vendor_knowledge').insert([{ 
                vendor_name: vendorName, 
                description: info.description, 
                website: info.website || "" 
            }]);

        } catch (e) {
            popupEl.innerHTML = `<strong>${vendorName}</strong><br><span class="text-muted">Merchant details unavailable.</span>`;
        }
    }

    function showPane(p) { document.querySelectorAll('.view-pane, #view-launchpad').forEach(el => el.style.display = 'none'); document.getElementById('view-' + p).style.display = 'block'; }
</script>
</body>
</html>
