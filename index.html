<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerIQ | Financial Automation</title>
    <!-- Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --hca-sage: #C5D1B8; --hca-dark: #2C3E50; --hca-bg: #F8F9FA; }
        body { background: var(--hca-bg); font-family: 'Segoe UI', sans-serif; color: var(--hca-dark); padding-bottom: 60px; }
        .rounded-xl { border-radius: 16px !important; }
        
        /* Glassmorphism Navbar */
        .navbar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 2px solid var(--hca-sage); padding: 0.8rem 2rem; }
        .brand-logo { font-weight: 800; letter-spacing: -0.5px; }
        .brand-badge { background: var(--hca-sage); color: var(--hca-dark); font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; margin-left: 6px; }

        /* Animated Hero Header */
        .hero-section { background: var(--hca-dark); color: white; padding: 60px 20px 70px; text-align: center; border-radius: 0 0 35px 35px; margin-bottom: 40px; position: relative; overflow: hidden; }
        .hero-section::before { content: "⚡"; position: absolute; font-size: 150px; opacity: 0.03; top: -20px; left: 10%; pointer-events: none; }
        .hero-section::after { content: "📊"; position: absolute; font-size: 150px; opacity: 0.03; bottom: -30px; right: 10%; pointer-events: none; }
        
        /* Fun Action Cards */
        .card-custom { background: white; border: none; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.04); height: 100%; display: flex; flex-direction: column; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
        .card-custom:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 40px rgba(44,62,80,0.12); }
        .card-img-top { height: 170px; object-fit: cover; width: 100%; filter: brightness(0.95); transition: 0.3s; }
        .card-custom:hover .card-img-top { filter: brightness(1.05); }
        
        /* Interactive Buttons */
        .btn-hca { background: var(--hca-sage); color: var(--hca-dark); border: none; font-weight: 700; padding: 12px 20px; border-radius: 12px; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(197,209,184,0.4); }
        .btn-hca:hover { background: #b4c2a5; transform: scale(1.03); color: var(--hca-dark); }
        .btn-dark-hca { background: var(--hca-dark); color: white; border-radius: 12px; padding: 12px 20px; font-weight: 700; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(44,62,80,0.3); }
        .btn-dark-hca:hover { background: #1a252f; transform: scale(1.03); color: white; }
        
        /* Status Dots with Pulse Animation */
        .status-pill { background: #f1f3f5; padding: 6px 14px; border-radius: 30px; border: 1px solid #e9ecef; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #bbb; }
        .dot-green { background: #2ca01c; box-shadow: 0 0 10px #2ca01c; animation: pulse 2s infinite; }
        .dot-amber { background: #f0ad4e; box-shadow: 0 0 10px #f0ad4e; }
        .dot-red { background: #d9534f; box-shadow: 0 0 10px #d9534f; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(44, 160, 28, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(44, 160, 28, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(44, 160, 28, 0); } }

        /* Floating AI Companion Trigger */
        #chat-trigger { position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px; background: var(--hca-dark); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.25); z-index: 3000; font-size: 26px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #chat-trigger:hover { transform: scale(1.15) rotate(10deg); background: var(--hca-sage); color: var(--hca-dark); }
        
        /* Other View Styles */
        .view-pane { display: none; }
        .dash-tab { display: none; }
        .app-nav { background: white; border-radius: 14px; display: flex; overflow: hidden; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .app-nav-btn { flex: 1; text-align: center; padding: 16px; cursor: pointer; font-weight: 700; border-right: 1px solid #f1f3f5; color: #7f8c8d; transition: 0.2s; }
        .app-nav-btn.active { background: var(--hca-sage); color: var(--hca-dark); }
        .summary-card { background: white; border-radius: 16px; padding: 22px; border-left: 6px solid var(--hca-sage); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        #st { background: white; border-radius: 16px; padding: 25px 35px; position: fixed; bottom: 30px; right: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); display: none; z-index: 2000; border: 2px solid var(--hca-sage); }
    </style>
</head>
<body>

<nav class="navbar d-flex justify-content-between align-items-center">
    <div class="fw-bold fs-4 brand-logo">Ledger<span class="fw-light text-muted">IQ</span> <span class="brand-badge">PRO</span></div>
    <div class="d-flex align-items-center gap-4">
        <div class="small fw-bold d-flex gap-2 status-pill">
            <div class="d-flex align-items-center me-2"><span class="status-dot" id="dot-ledger"></span> DB</div>
            <div class="d-flex align-items-center me-2"><span class="status-dot" id="dot-gemini"></span> AI</div>
            <div class="d-flex align-items-center"><span class="status-dot" id="dot-qbo"></span> QBO</div>
        </div>
        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 fw-bold" onclick="location.reload()">🏠 Home</button>
    </div>
</nav>

<div id="view-launchpad">
    <header class="hero-section">
        <h1 class="display-5 fw-bold mb-2">Smart Ledger Automation 🚀</h1>
        <p class="lead opacity-75 mb-0">AI-Powered Forensic Processing & QBO Sync</p>
    </header>
    <div class="container">
        <div id="keyGate" class="row justify-content-center">
            <div class="col-md-5"><div class="card card-custom p-4 text-center">
                <h5 class="mb-3 fw-bold">🔑 Unlock Workspace</h5>
                <input type="password" id="master_gk" class="form-control mb-3 text-center rounded-pill" placeholder="Paste Gemini API Key">
                <button class="btn btn-dark-hca w-100 rounded-pill" onclick="lockKey()">Open Portal ✨</button>
            </div></div>
        </div>
        <div id="mainPortal" style="display:none">
            <div class="card p-4 rounded-xl border-0 shadow-sm mb-4">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <select id="masterClient" class="form-select rounded-pill shadow-none" onchange="pingStatus()"><option value="">-- Choose Client Profile --</option></select>
                    </div>
                    <div class="col-md-4 text-end pt-0"><button class="btn btn-dark-hca rounded-pill" onclick="showPane('config')">⚙️ Client Settings</button></div>
                </div>
            </div>
            <div class="row g-4" id="actionGrid" style="opacity:0.3; pointer-events:none;">
                <div class="col-md-4"><div class="card card-custom">
                    <img src="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=600&q=80" class="card-img-top">
                    <div class="card-body p-4 text-center"><button class="btn btn-hca w-100" onclick="triggerFile('PDF')">📄 Process Bank PDF</button></div>
                </div></div>
                <div class="col-md-4"><div class="card card-custom">
                    <img src="https://images.unsplash.com/photo-1563013544-824ae1b704d3?auto=format&fit=crop&w=600&q=80" class="card-img-top">
                    <div class="card-body p-4 text-center"><button class="btn btn-hca w-100" onclick="triggerFile('CC')">💳 Process CC PDF</button></div>
                </div></div>
                <div class="col-md-4"><div class="card card-custom">
                    <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=600&q=80" class="card-img-top">
                    <div class="card-body p-4 text-center"><button class="btn btn-hca w-100" onclick="loadDash()">📊 Open Dashboard</button></div>
                </div></div>
            </div>
            <input type="file" id="f_pdf" style="display:none" onchange="handleFile(this, 'PDF')">
            <input type="file" id="f_cc" style="display:none" onchange="handleFile(this, 'CC')">
        </div>
    </div>
</div>

<div id="chat-trigger" onclick="toggleChat()">🤖</div>

</body>
</html>
